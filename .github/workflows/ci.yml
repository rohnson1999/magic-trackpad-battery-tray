name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile, test and package
        shell: powershell
        run: .\scripts\package.ps1
      - name: Upload portable package and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MagicTrackpadBattery-windows-x64
          path: |
            artifacts/MagicTrackpadBattery.exe
            artifacts/MagicTrackpadBattery-*-windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
